spring.application.name=digital-backend-application

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${db}
spring.datasource.username=${username}
spring.datasource.password=${password}
spring.datasource.hikari.maximum-pool-size=10
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true
spring.web.error.include-stacktrace=always

# JWT Configuration
jwt.secret.string=${JWT_SECRET}
jwt.expiration.time=${JWT_EXPIRATION_TIME}
jwt.refresh.expiration.time=${JWT_REFRESH_EXPIRATION_TIME}

security.encryption.password=${ENCRYPTION_PASSWORD}
security.encryption.salt=${ENCRYPTION_SALT}

# Resend Configuration
resend.api.key=${RESEND_API_KEY}
resend.sender.email=${RESEND_SENDER_EMAIL}

springdoc.swagger-ui.path=/swagger-ui.html

#FLYWAY CONFIGURATION
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration